name: Deploy Angular App to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/KuwaitMoving.Client/package-lock.json

      - name: Install Dependencies
        working-directory: src/KuwaitMoving.Client
        run: npm ci

      - name: Build Angular for GitHub Pages
        working-directory: src/KuwaitMoving.Client
        run: |
          npx ng build --base-href /kuwait-moving/
          cp dist/kuwait-moving-client/browser/index.html dist/kuwait-moving-client/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/KuwaitMoving.Client/dist/kuwait-moving-client/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
